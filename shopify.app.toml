# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "8da1addef3dcd4251db5057cda3c85fa"
# THE APP NAME, as Sam settled it 2026-08-02: "The Ritualist", capitalised.
# He has now asserted this casing three times across two sessions and been
# right each time; the lowercase `the ritualist` that briefly lived here came
# off MY framing, not his. `ritualist` (no article) and `ritualist - order page
# media` are both bad memory from the 08-01 handoff pack.
#
# THIS MUST MATCH THE PARTNER DASHBOARD. The Dashboard name is edited by hand;
# this file overwrites it on the next `shopify app deploy`. Leaving them
# different means a deploy silently reverts the Dashboard, which is how a name
# change gets undone weeks later by someone shipping an unrelated config.
#
# The wordmark is a separate asset and stays lowercase with its period —
# `the ritualist.` — per parallelreturns #644. Prose follows #644 too:
# "The Ritualist" sentence-initial, "the Ritualist" mid-sentence, bare
# "Ritualist" adjectival. A name field reading "The Ritualist" beside a
# lowercase wordmark is CORRECT, not drift.
#
# Inert until the next gated `shopify app deploy`; never regenerate this
# app's credentials.
name = "The Ritualist"
# app.in.ink = the Worker front door (parallelreturns #359, VERIFIED live +
# byte-identical to Cloud Run 2026-07-05). The App Store checker rejects app
# URLs whose DOMAIN contains "shopify" — shopify-app-…run.app does. Goes live
# on the gated `shopify app deploy` TOGETHER with the env flip:
#   gcloud run services update shopify-app --region us-central1 \
#     --project inink-c76d3 --update-env-vars SHOPIFY_APP_URL=https://app.in.ink
application_url = "https://app.in.ink"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-10"

# Webhook URIs are ABSOLUTE to Cloud Run on purpose: with application_url now
# app.in.ink, relative URIs would resolve through the Worker proxy — adding a
# hop (and a failure domain) to the enroll/delivery heart. The URL checker
# targets app/redirect URLs; if review ever flags webhook hosts too, flip
# these to https://app.in.ink/... (the proxy passes raw bodies, HMAC survives).

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://shopify-app-250065525755.us-central1.run.app/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "https://shopify-app-250065525755.us-central1.run.app/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  # Must match the flat-route handler file webhooks.orders_create.ts → the path
  # is /webhooks/orders_create (underscore). The old "/webhooks/orders/create"
  # (slash) routed to a non-existent handler → a re-register would 404 and break
  # enroll. The live subscription already uses the underscore.
  uri = "https://shopify-app-250065525755.us-central1.run.app/webhooks/orders_create"

  [[webhooks.subscriptions]]
  topics = [ "orders/fulfilled" ]
  uri = "https://shopify-app-250065525755.us-central1.run.app/webhooks/orders_fulfilled"

  # GDPR compliance topics — MANDATORY for App Store review (auto-fail if
  # missing). Handlers already existed; this registers them. HMAC is verified
  # by authenticate.webhook(), which 401s invalid signatures (also required).
  # Takes effect on the next gated `shopify app deploy` (§17.7/§17.8: after
  # deploying, audit shops for duplicate shop-level subs + delivery counts).
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "https://shopify-app-250065525755.us-central1.run.app/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "https://shopify-app-250065525755.us-central1.run.app/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "https://shopify-app-250065525755.us-central1.run.app/webhooks/shop/redact"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_returns + write_returns: Phase 2 drives a native Shopify Return
# (returnableFulfillments query + returnCreate mutation) so the merchant's own
# Shopify Shipping issues the label, billed to them — ink stops fronting Shippo.
scopes = "read_assigned_fulfillment_orders,write_assigned_fulfillment_orders,read_customers,read_files,write_files,read_fulfillments,write_fulfillments,read_metaobjects,write_metaobjects,read_online_store_pages,write_online_store_pages,read_orders,write_orders,read_returns,write_returns,write_shipping,write_themes"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://app.in.ink/auth/callback",
  "https://app.in.ink/auth/shopify/callback"
]
