# THE ORDER STATUS PAGE CARRIES THE DOOR.
#
# Shopify's notification templates cannot be edited by any app (re-verified
# 2026-08-23: notification templates are admin-UI-only; the internal
# EmailTemplateUpdate mutation is not callable) — so the email's primary
# button will point at Shopify's own Order status page for every store that
# never does the manual paste. This extension makes that page OURS to speak
# on: the button lands the buyer one tap from the brand's order page, with
# zero merchant work.
#
# Why this is durable where the paste is not:
#   · It ships inside the app. Install = on. No per-store template surgery.
#   · `customer-account.order-status.block.render` self-places: "by default,
#     block extensions are placed in the first available placement reference"
#     (shopify.dev, build-order-status). The merchant CAN move or remove it in
#     the checkout & accounts editor; they never have to touch it.
#   · The Order status page is pre-authenticated — buyers arriving from the
#     email's button see it without logging in. All plans, not just Plus.
#
# The app holds the switch: the block renders ONLY when the `ink:order_door`
# shop metafield carries a door base. No metafield → the extension renders
# nothing at all (the Clare-V law: neutral/empty when data is missing). The
# embed writes and clears that metafield server-side
# (order-door-metafield.server.ts), so turning a store on or off never needs
# a redeploy of this extension.

api_version = "2026-07"

[[extensions]]
type = "ui_extension"
name = "ink order page"
handle = "order-page-block"
uid = "32c2b02f-8707-56d2-4baf-e6cf4ff74acdbc4e3d5a"

  # THE TARGET IS STATIC, AND THAT IS THE WHOLE POINT — MEASURED, not guessed.
  #
  # `block.render` was the first attempt and it did NOT render on a real
  # fulfilled order status page (Steve Madden #1020, 2026-08-23, with
  # the-ritualist-14 live and the shop metafield present). Shopify's extension
  # runtime WAS active on that page — another app's order-action extension
  # loaded from the CDN in the same pageview — so the platform was working and
  # our block simply had never been PLACED. Block targets render "where the
  # merchant sets them using the checkout editor", and a merchant who has to
  # open an editor is the same merchant who was never going to paste Liquid.
  #
  # A static target renders in a fixed location with no editor step. This one
  # sits directly under the shipment and its tracking number — exactly where
  # "where is my order" gets asked.
  #
  # KNOWN LIMITS, both deliberate:
  #  · It renders ONCE PER FULFILLMENT (the target carries a fulfillmentId), so
  #    a split shipment shows the card per parcel. Every parcel belongs to one
  #    order and the link is the same page, so this is repetitive, not wrong.
  #  · An UNFULFILLED order has no fulfillment details, so nothing renders yet.
  #    The block is a "where is it" answer; before anything ships there is no
  #    question to answer. The tracking rewrite already covers the shipped case
  #    from the email itself.
  [[extensions.targeting]]
  module = "./src/order-page-block.js"
  target = "customer-account.order-status.fulfillment-details.render-after"

  # The one piece of app data the block needs: the brand's own door base,
  # e.g. https://stevemadden.in.ink/o/ — written on the SHOP by the embed at
  # enroll time. Declared here so the runtime delivers it via appMetafields.
  [[extensions.metafields]]
  namespace = "ink"
  key = "order_door"

  # Shopify's own order-status example ships this, and we do not know that the
  # runtime will hand us declared metafields without it. Measured 2026-08-23:
  # with the-ritualist-15 released and the shop metafield present, our bundle
  # was never even FETCHED on a real order page (5 checks over 9 minutes — not
  # a propagation delay). This is the one difference between our config and the
  # documented working example, so it gets ruled out before we spend a real
  # order on the test.
  [extensions.capabilities]
  api_access = true
